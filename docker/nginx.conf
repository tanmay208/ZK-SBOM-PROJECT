events {}

http {
    server {
        listen 80;
        client_max_body_size 10m;
        proxy_read_timeout 600;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        location /api/v1/sbom {
            proxy_pass http://sbom-service:8000/api/v1/sbom;
        }

        location /api/v1/applications {
            proxy_pass http://sbom-service:8000/api/v1/applications;
        }

        location /api/v1/vulnerability {
            proxy_pass http://vulnerability-service:8001/api/v1/vulnerability;
        }

        location /api/v1/policy {
            proxy_pass http://policy-service:8002/api/v1/policy;
        }

        location /api/v1/zkp {
            proxy_pass http://zkp-service:8003/api/v1/zkp;
        }

        location /api/v1/verification {
            proxy_pass http://verification-service:8004/api/v1/verification;
        }

        location /api/v1/auth {
            proxy_pass http://verification-service:8004/api/v1/auth;
        }

        location /api/v1/admin {
            proxy_pass http://verification-service:8004/api/v1/admin;
        }

        location /api/v1/metrics {
            proxy_pass http://verification-service:8004/api/v1/metrics;
        }

        location /api/v1/health {
            proxy_pass http://verification-service:8004/api/v1/health;
        }
    }
}
