# Alembic Configuration — SQL Server 2022
# Database: ONE SQL Server instance, five logical schemas

[alembic]
script_location = alembic
sqlalchemy.url = mssql+pyodbc://sa:%(DB_PASSWORD)s@localhost:1433/ZKP_SBOM?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
