# ==============================================================================
# Docker Compose — Isolated Local Development Environment
# Target: Disposable local PostgreSQL container 'zkp_sbom_local_dev'
#
# INVOCATION INSTRUCTIONS (STAGE 2+):
# ------------------------------------------------------------------------------
# 1. Ensure the user-defined network exists and the disposable DB is attached:
#      docker network inspect zkp_sbom_local_net >$null 2>&1 || docker network create zkp_sbom_local_net
#      docker network connect zkp_sbom_local_net zkp_sbom_local_dev
#
# 2. Populate .env.local_dev from .env.local_dev.example (never commit .env.local_dev):
#      # Generate cryptographically secure random secrets locally without console display.
#
# 3. Invoke Compose with the explicit --env-file flag:
#      docker compose --env-file .env.local_dev -f docker-compose.local.yml up -d
#
# WHY THIS INVOCATION PREVENTS ACCIDENTAL ROOT .env INHERITANCE:
# ------------------------------------------------------------------------------
# - By default, Docker Compose CLI reads '.env' from the current working directory.
#   Passing '--env-file .env.local_dev' explicitly tells the CLI to use .env.local_dev
#   for any CLI resolution and prevents reading the root '.env'.
# - Each microservice defines 'env_file: - .env.local_dev', directly injecting
#   application secrets (JWT_SECRET_KEY, CERTIFICATE_SECRET_KEY, DB_PASSWORD, etc.)
#   from the local environment file into the container runtime.
# - Secrets are NOT referenced via '${VARIABLE}' syntax in this file, ensuring that
#   Compose CLI never interpolates secrets from root '.env' or host environment.
# - Database target parameters (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_SSL_MODE, ENVIRONMENT)
#   are hardcoded under 'environment:' for every service. In Compose, 'environment:'
#   overrides 'env_file:', guaranteeing that services strictly target
#   'zkp_sbom_local_dev:5432/ZKP_SBOM_LOCAL_DEV' in local_dev mode.
#
# LIVENESS VS. DATABASE READINESS:
# ------------------------------------------------------------------------------
# - The HTTP health checks (/api/v1/health) verify ASGI application responsiveness ONLY.
# - They DO NOT test database socket connectivity, table existence, or Alembic schema
#   revisions (revision 014). Passing HTTP checks DO NOT establish database readiness.
# ==============================================================================

services:
  # API Gateway — Nginx reverse proxy routing requests to local microservices
  api-gateway:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      sbom-service:
        condition: service_healthy
      vulnerability-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      zkp-service:
        condition: service_healthy
      verification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/api/v1/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - zkp_sbom_local_net

  # SBOM Microservice
  sbom-service:
    build:
      context: ./backend
      dockerfile: sbom_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro
    env_file:
      - .env.local_dev
    environment:
      - ENVIRONMENT=local_dev
      - DB_DRIVER=postgresql+psycopg2
      - DB_HOST=zkp_sbom_local_dev
      - DB_PORT=5432
      - DB_NAME=ZKP_SBOM_LOCAL_DEV
      - DB_USER=postgres
      - DB_SSL_MODE=disable
      - DB_ECHO=false
      - CRYPTO_PROFILE=dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - zkp_sbom_local_net

  # Vulnerability Microservice
  vulnerability-service:
    build:
      context: ./backend
      dockerfile: vulnerability_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro
    env_file:
      - .env.local_dev
    environment:
      - ENVIRONMENT=local_dev
      - DB_DRIVER=postgresql+psycopg2
      - DB_HOST=zkp_sbom_local_dev
      - DB_PORT=5432
      - DB_NAME=ZKP_SBOM_LOCAL_DEV
      - DB_USER=postgres
      - DB_SSL_MODE=disable
      - DB_ECHO=false
      - CRYPTO_PROFILE=dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - zkp_sbom_local_net

  # Policy Microservice
  policy-service:
    build:
      context: ./backend
      dockerfile: policy_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro
    env_file:
      - .env.local_dev
    environment:
      - ENVIRONMENT=local_dev
      - DB_DRIVER=postgresql+psycopg2
      - DB_HOST=zkp_sbom_local_dev
      - DB_PORT=5432
      - DB_NAME=ZKP_SBOM_LOCAL_DEV
      - DB_USER=postgres
      - DB_SSL_MODE=disable
      - DB_ECHO=false
      - CRYPTO_PROFILE=dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - zkp_sbom_local_net

  # ZKP Prover Microservice
  zkp-service:
    build:
      context: ./backend
      dockerfile: zkp_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro
      - ./archive:/archive
      - ./archive:/archives
    env_file:
      - .env.local_dev
    environment:
      - ENVIRONMENT=local_dev
      - DB_DRIVER=postgresql+psycopg2
      - DB_HOST=zkp_sbom_local_dev
      - DB_PORT=5432
      - DB_NAME=ZKP_SBOM_LOCAL_DEV
      - DB_USER=postgres
      - DB_SSL_MODE=disable
      - DB_ECHO=false
      - CRYPTO_PROFILE=dev
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - zkp_sbom_local_net

  # Verification Microservice
  verification-service:
    build:
      context: ./backend
      dockerfile: verification_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro
      - ./archive:/archive
      - ./archive:/archives
    env_file:
      - .env.local_dev
    environment:
      - ENVIRONMENT=local_dev
      - DB_DRIVER=postgresql+psycopg2
      - DB_HOST=zkp_sbom_local_dev
      - DB_PORT=5432
      - DB_NAME=ZKP_SBOM_LOCAL_DEV
      - DB_USER=postgres
      - DB_SSL_MODE=disable
      - DB_ECHO=false
      - CRYPTO_PROFILE=dev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - zkp_sbom_local_net

networks:
  zkp_sbom_local_net:
    external: true
    name: zkp_sbom_local_net
