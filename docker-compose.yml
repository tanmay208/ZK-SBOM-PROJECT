services:
  # Gateway — internal HTTP hop. TLS terminates outside this Compose project;
  # no plaintext API port is published on the host. See docs/DEPLOYMENT_TLS_BOUNDARY.md.
  api-gateway:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      sbom-service:
        condition: service_started
      vulnerability-service:
        condition: service_started
      policy-service:
        condition: service_started
      zkp-service:
        condition: service_started
      verification-service:
        condition: service_started

  # Microservices — all use decomposed env vars, no inline credentials
  sbom-service:
    build:
      context: ./backend
      dockerfile: sbom_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro

    environment:
      - DB_DRIVER=${DB_DRIVER:-postgresql+psycopg2}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-ZKP_SBOM}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CERTIFICATE_SECRET_KEY=${CERTIFICATE_SECRET_KEY}
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-prod}

  vulnerability-service:
    build:
      context: ./backend
      dockerfile: vulnerability_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro

    environment:
      - DB_DRIVER=${DB_DRIVER:-postgresql+psycopg2}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-ZKP_SBOM}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CERTIFICATE_SECRET_KEY=${CERTIFICATE_SECRET_KEY}
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-prod}

  policy-service:
    build:
      context: ./backend
      dockerfile: policy_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro

    environment:
      - DB_DRIVER=${DB_DRIVER:-postgresql+psycopg2}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-ZKP_SBOM}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CERTIFICATE_SECRET_KEY=${CERTIFICATE_SECRET_KEY}
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-prod}

  zkp-service:
    build:
      context: ./backend
      dockerfile: zkp_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro
      - ./archive:/archive
      - ./archive:/archives

    environment:
      - DB_DRIVER=${DB_DRIVER:-postgresql+psycopg2}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-ZKP_SBOM}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CERTIFICATE_SECRET_KEY=${CERTIFICATE_SECRET_KEY}
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-prod}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 1G

  verification-service:
    build:
      context: ./backend
      dockerfile: verification_service/Dockerfile
    volumes:
      - ./segment_init_32:/segment_init_32:ro
      - ./segment_mid_32:/segment_mid_32:ro
      - ./segment_final_32:/segment_final_32:ro
      - ./archive:/archive
      - ./archive:/archives

    environment:
      - DB_DRIVER=${DB_DRIVER:-postgresql+psycopg2}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - DB_NAME=${DB_NAME:-ZKP_SBOM}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CERTIFICATE_SECRET_KEY=${CERTIFICATE_SECRET_KEY}
      - CRYPTO_PROFILE=${CRYPTO_PROFILE:-prod}
      - CERTIFICATE_ACTIVE_KID=${CERTIFICATE_ACTIVE_KID:-v1}
      - CERTIFICATE_SECRET_KEYS=${CERTIFICATE_SECRET_KEYS}
